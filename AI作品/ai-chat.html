<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园AI陪伴助手 - 重庆大学校园社区</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 300px);
    min-height: 100vh;
    color: #1e293b;
  }

  /* 返回首页：固定左上角（全局统一样式） */
  .back {
    position: fixed;
    top: 20px; left: 20px;
    z-index: 900;
    display: inline-block;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(30, 41, 59, .07);
    padding: 8px 14px;
    color: #475569;
    font-size: .88rem;
    text-decoration: none;
    transition: background .18s, color .18s, border-color .18s, transform .18s;
  }
  .back:hover { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; transform: translateY(-1px); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 18px 40px; }
  .page-title { text-align: center; font-size: 1.6rem; font-weight: 800; }
  .page-sub { text-align: center; font-size: .82rem; color: #94a3b8; margin: 6px 0 22px; letter-spacing: 1px; }

  /* 聊天卡片 */
  .chat-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 10px 34px rgba(30, 41, 59, .09);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 170px);
    min-height: 420px;
  }

  /* 模式切换 Tab */
  .mode-tabs {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #eef2f7;
    background: #fbfcfe;
  }
  .mode-btn {
    flex: 1;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #64748b;
    border-radius: 50px;
    padding: 9px 12px;
    font-size: .88rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all .18s ease;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, .3);
  }

  /* 消息列表：唯一滚动区 */
  .msg-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background:
      radial-gradient(circle at 15% 10%, rgba(99,102,241,.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(139,92,246,.05), transparent 40%);
  }
  .msg { display: flex; gap: 9px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem;
  }
  .msg.ai .msg-avatar { background: linear-gradient(135deg, #818cf8, #6366f1); box-shadow: 0 3px 10px rgba(99,102,241,.35); }
  .msg.user .msg-avatar { background: #dcfce7; }
  .msg-content { max-width: 74%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user .msg-content { align-items: flex-end; }
  .msg-who { font-size: .72rem; color: #94a3b8; padding: 0 2px; }
  .msg-bubble {
    font-size: .9rem;
    line-height: 1.7;
    padding: 10px 14px;
    border-radius: 4px 14px 14px 14px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.ai .msg-bubble {
    background: #fff;
    border: 1px solid #e2e8f0;
    color: #334155;
    box-shadow: 0 1px 3px rgba(30, 41, 59, .05);
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    border-radius: 14px 4px 14px 14px;
    box-shadow: 0 3px 10px rgba(22,163,74,.25);
  }

  /* AI 正在思考：三点跳动 */
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #a5b4fc;
    animation: typingBlink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes typingBlink {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  .typing-text { font-size: .8rem; color: #818cf8; margin-right: 2px; }

  /* 底部输入区 */
  .input-bar {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid #eef2f7;
    background: #fff;
  }
  .input-bar input {
    flex: 1;
    min-width: 0;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 11px 15px;
    font-size: .9rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-bar input:focus { border-color: #a5b4fc; box-shadow: 0 0 0 3px rgba(99, 102, 241, .14); }
  .send-btn {
    flex: none;
    border: none;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
    border-radius: 12px;
    padding: 0 22px;
    font-size: .9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: filter .15s, transform .15s;
  }
  .send-btn:hover { filter: brightness(1.06); }
  .send-btn:active { transform: scale(.96); }
  .send-btn:disabled { opacity: .55; cursor: not-allowed; filter: none; }

  @media (max-width: 560px) {
    .chat-card { height: calc(100vh - 150px); }
    .msg-content { max-width: 82%; }
  }
</style>
</head>
<body>

  <a class="back" href="index.html">← 返回首页</a>

  <div class="wrap">
    <h1 class="page-title">✨ 校园AI陪伴助手</h1>
    <p class="page-sub">CQU AI COMPANION</p>

    <div class="chat-card">
      <!-- 模式切换 -->
      <div class="mode-tabs">
        <button type="button" class="mode-btn active" id="modeChat">💬 聊天模式</button>
        <button type="button" class="mode-btn" id="modeGuide">🧭 引导模式</button>
      </div>

      <!-- 消息列表 -->
      <div class="msg-list" id="msgList"></div>

      <!-- 输入区 -->
      <div class="input-bar">
        <input type="text" id="chatInput" placeholder="说点什么吧..." autocomplete="off" maxlength="300">
        <button type="button" class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

<script src="ai-core.js"></script>
<script>
  /* ============================================================
     AI 陪伴助手：两种模式各有独立 system prompt 与欢迎语
     真实回复统一请求本站边缘函数 /api/ai（密钥在服务端，前端无 Key）
     ============================================================ */
  const MODES = {
    chat: {
      welcome: '跟我聊聊今天遇到的好事，倾诉倾诉坏事吧。我会一直在这里倾听~',
      system: '你是一个温暖、有共情能力的校园AI陪伴助手。请给用户提供充足的情绪价值，用温柔、鼓励、安慰的语气回应。不要给出冷冰冰的说教，要像树洞一样倾听，字数控制在100字以内。',
      fallback: '我一直在听哦，请继续说吧~'
    },
    guide: {
      welcome: '你好呀！我是校园社区的向导，你可以问我：怎么搜索校园信息？怎么发起投票？最近有什么热门帖子？我会为你详细解答哦~',
      fallback: '抱歉，我暂时无法回答，请检查网络连接或观看演示视频。',
      empty: '当前站内数据较少，你可以去论坛发个新帖呀！'
    }
  };

  /* ============================================================
     引导模式 RAG 雏形：从 localStorage 抓取站内实时数据
     · polls：vote.html 真实持久化（首次访问即有演示种子）
     · posts：forum.html 的预设帖为内存数组不入库，
             localStorage 有真实帖子时优先使用，否则用与论坛
             一致的最新 5 条兜底，保证向导开箱即可作答
     ============================================================ */
  const FALLBACK_LATEST_POSTS = [
    'A区一食堂二楼的那家饺子店怎么样？',
    '高数课选哪个老师好啊？',
    '思群广场晚上几点关门？',
    'B区门口的煎饼果子还在吗？',
    '虎溪图书馆插座紧张吗，需要抢座不？'
  ];

  // 返回 { titles, realEmpty }：键不存在（普通访问）走兜底；键存在但为空数组（用户清空）算真空
  function readLatestPosts() {
    const raw = localStorage.getItem('posts');
    if (raw !== null) {
      try {
        if (Array.isArray(raw) && raw.length) return { titles: raw, realEmpty: false };
        const list = JSON.parse(raw);
        if (Array.isArray(list)) {
          return { titles: list.map(p => p && (p.content || p.title)).filter(Boolean), realEmpty: list.length === 0 };
        }
      } catch (e) { /* 解析失败走兜底 */ }
    }
    return { titles: FALLBACK_LATEST_POSTS.slice(), realEmpty: false };
  }

  function readHotOngoingPolls() {
    try {
      const list = JSON.parse(localStorage.getItem('polls') || '[]');
      if (!Array.isArray(list)) return [];
      const now = Date.now();
      return list
        .filter(p => p && p.question && p.status !== 'finished' &&
          !(p.deadline && new Date(String(p.deadline).replace(/-/g, '/')).getTime() <= now))
        .map(p => ({
          question: p.question,
          votes: (p.options || []).reduce((s, o) => s + (Number(o.votes) || 0), 0)
        }))
        .sort((a, b) => b.votes - a.votes)
        .slice(0, 3)
        .map(p => p.question);
    } catch (e) {
      return [];
    }
  }

  // 拼接简洁的站内数据摘要文本；返回 { text, isEmpty }
  function buildSiteDigest() {
    const { titles, realEmpty } = readLatestPosts();
    const posts = titles.slice(0, 5);
    const polls = readHotOngoingPolls();
    if (realEmpty && !polls.length) {
      return { text: '当前站内暂无帖子与投票数据。', isEmpty: true };
    }
    const lines = ['【当前站内最新数据摘要】'];
    lines.push(posts.length
      ? '最新帖子：' + posts.map((t, i) => `${i + 1}.《${t}》`).join('')
      : '最新帖子：暂无');
    lines.push(polls.length
      ? '正在进行的热门投票：' + polls.map((t, i) => `${i + 1}.《${t}》`).join('')
      : '正在进行的热门投票：暂无');
    return { text: lines.join('\n'), isEmpty: false };
  }

  // 引导模式：功能手册 + 实时数据摘要 + 回答规则（每次提问时实时拼接）
  function buildGuideSystemPrompt(digest) {
    return `你是“重庆大学校园社区”的官方AI向导，请用礼貌、清晰、友善的语气解答用户的疑问。

【站内功能手册】

1. 网站包含：首页、信息库、论坛、投票、圈子、个人中心。
2. 信息库：可搜索校园官方通知、绩点计算等，带有“✨ AI增强搜索”功能。
3. 论坛：可发帖、点赞、评论、追问。有等级体系（Lv.1到Lv.6），高等级有专属颜色。搜索帖子时支持AI智能总结。
4. 投票：发起投票需要Lv.4以上或认证身份。有盲投机制（未结束不显示票数），结束后显示扇形图。
5. 圈子：包含“广场”（社团广告）和“我的圈子”，分为外圈（公开动态）和内圈（内部决策）。
6. 个人中心：左上角可切换身份（普通用户/学校管理员/认证学生领袖），可修改头像、昵称和清空数据。

【当前站内实时数据摘要】
${digest}

【回答规则】

1. 请结合“站内功能手册”和“站内实时数据摘要”回答问题。
2. 如果用户问的是具体功能规则，依据手册回答。
3. 如果用户问的是抽象概念（如“最近有什么热闹的帖子”、“大家最近在关注什么”、“有什么推荐的”），请利用你的常识，将用户的问题与数据摘要中的具体帖子、投票进行语义关联和推断，进行合理的总结归纳，而不是死板地重复标题。
4. 如果数据摘要为空（用户清空了数据），请回复：“当前站内数据较少，你可以去论坛发个新帖呀！”
5. 如果问题完全超出站内范围，请礼貌地说：“抱歉，这个我还不清楚，建议你去论坛发帖问问同学们~”。
6. 回答字数控制在100字以内，条理清晰，语气亲切。`;
  }

  const msgList = document.getElementById('msgList');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const modeChatBtn = document.getElementById('modeChat');
  const modeGuideBtn = document.getElementById('modeGuide');

  let mode = 'chat';         // 当前模式
  let history = [];          // 发给大模型的多轮消息（不含 system，system 每次按模式拼装）
  let thinking = false;      // AI 回复中，锁定发送

  // 渲染一条消息（role: 'ai' | 'user'）
  function appendMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = role === 'ai' ? '🤖' : '🙂';
    const who = role === 'ai' ? 'AI助手' : '我';
    wrap.innerHTML = `
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-content">
        <div class="msg-who">${who}</div>
        <div class="msg-bubble"></div>
      </div>`;
    wrap.querySelector('.msg-bubble').textContent = text;
    msgList.appendChild(wrap);
    msgList.scrollTop = msgList.scrollHeight;
    return wrap;
  }

  // “AI正在思考...”临时气泡，返回该节点供之后移除
  function appendTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.id = 'typingRow';
    wrap.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-content">
        <div class="msg-who">AI助手</div>
        <div class="msg-bubble">
          <span class="typing-text">AI正在思考...</span>
          <span class="typing"><span></span><span></span><span></span></span>
        </div>
      </div>`;
    msgList.appendChild(wrap);
    msgList.scrollTop = msgList.scrollHeight;
    return wrap;
  }

  // 切换模式：互斥高亮 + 重置该模式的对话与欢迎语（不刷新页面）
  function switchMode(next) {
    if (next === mode) return;
    mode = next;
    history = [];
    msgList.innerHTML = '';
    modeChatBtn.classList.toggle('active', mode === 'chat');
    modeGuideBtn.classList.toggle('active', mode === 'guide');
    appendMessage('ai', MODES[mode].welcome);
    chatInput.focus();
  }
  modeChatBtn.addEventListener('click', () => switchMode('chat'));
  modeGuideBtn.addEventListener('click', () => switchMode('guide'));

  // 请求边缘函数（流式）：onChunk 实时吐增量；失败/断网 throw，由调用方走兜底文案
  async function requestAIStream(messages, onChunk) {
    return callAIAPIStream(messages, onChunk);
  }

  async function handleSend() {
    const text = chatInput.value.trim();
    if (!text || thinking) return;

    // 1. 用户消息上墙 + 清空输入
    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    chatInput.value = '';

    // 2. 锁定输入，显示思考态
    thinking = true;
    sendBtn.disabled = true;
    const typingRow = appendTyping();

    // 引导模式：发送时实时抓取站内数据拼 system prompt；
    // 帖子与投票全部为空（用户清空数据）时，直接本地回复规则4文案，不调接口
    let systemPrompt = MODES.chat.system;
    let emptyDigest = false;
    if (mode === 'guide') {
      const digest = buildSiteDigest();
      emptyDigest = digest.isEmpty;
      systemPrompt = buildGuideSystemPrompt(digest.text);
    }

    // 3. 至少展示 1.5 秒“思考”动画
    await new Promise(r => setTimeout(r, 1500));
    typingRow.remove();

    // 4. 先放一个空的 AI 气泡，回复内容逐字流式追加（气泡生成后再打字）
    const aiRow = appendMessage('ai', '');
    const bubble = aiRow.querySelector('.msg-bubble');
    let aiText = '';
    const typer = createTextTyper(piece => {
      aiText += piece;
      bubble.textContent = aiText;
      msgList.scrollTop = msgList.scrollHeight;
    }, 26, 2);

    let finalText = '';
    if (emptyDigest) {
      // 数据为空 → 规则4文案，同样逐字输出
      typer.feed(MODES.guide.empty);
      finalText = MODES.guide.empty;
    } else {
      try {
        finalText = await requestAIStream(
          [{ role: 'system', content: systemPrompt }, ...history],
          delta => typer.feed(delta)
        );
      } catch (err) {
        // 断网 / 503 / 超时 → 网络兜底文案，逐字输出
        console.warn('[ai-chat] 流式调用失败，启用兜底文案：', err);
        typer.feed(MODES[mode].fallback);
        finalText = MODES[mode].fallback;
      }
    }
    await typer.finish();
    bubble.textContent = finalText;   // 完整文本兜底一次
    msgList.scrollTop = msgList.scrollHeight;
    history.push({ role: 'assistant', content: finalText });

    thinking = false;
    sendBtn.disabled = false;
    chatInput.focus();
  }

  sendBtn.addEventListener('click', handleSend);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

  // 初始欢迎语（默认聊天模式）
  appendMessage('ai', MODES.chat.welcome);
</script>
</body>
</html>
