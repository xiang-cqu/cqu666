<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圈子 - 重庆大学智慧校园</title>
<script src="ai-core.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #1e293b;
    min-height: 100vh;
  }

  /* ---------- 返回论坛：固定左上角（与 forum/search/vote 统一方框样式） ---------- */
  .back {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 900;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(30, 41, 59, .07);
    padding: 8px 14px;
    color: #475569;
    text-decoration: none;
    font-size: .88rem;
    transition: background .18s, color .18s, border-color .18s, transform .18s;
  }
  .back:hover { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; transform: translateY(-1px); }

  /* ---------- 右上角搜索（四页统一风格） ---------- */
  .search-wrap { position: fixed; top: 20px; right: 20px; z-index: 900; display: inline-flex; align-items: center; gap: 8px; }
  .search-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(30, 41, 59, .07);
    padding: 8px 14px;
    color: #475569;
    font-size: .88rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .search-btn:hover { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }
  .search-ai-chip {
    font-size: .72rem;
    font-weight: 600;
    color: #7c3aed;
    background: #f5f3ff;
    border: 1px solid #ddd6fe;
    border-radius: 50px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .search-pop {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    display: none;
    flex-wrap: wrap;
    gap: 10px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(30, 41, 59, .16);
    padding: 14px;
    width: 380px;
    max-width: 86vw;
  }
  .search-pop.open { display: flex; }
  .search-pop select,
  .search-pop input {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 9px 11px;
    font-size: .86rem;
    font-family: inherit;
    color: #334155;
    background: #fff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-pop select { flex: 0 0 auto; cursor: pointer; }
  .search-pop input { flex: 1 1 150px; min-width: 0; }
  .search-pop select:focus,
  .search-pop input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99, 102, 241, .14); }
  .search-go {
    flex: 0 0 auto;
    border: none;
    background: #4f46e5;
    color: #fff;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: .86rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .search-go:hover { background: #4338ca; }

  /* ---------- AI 搜索总结卡（与其他页面 AI 卡片风格一致） ---------- */
  .circle-ai-card {
    background: linear-gradient(135deg, #eef2ff, #f5f3ff);
    border: 1px solid #e0e7ff;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: .88rem;
    line-height: 1.7;
    color: #3730a3;
    box-shadow: 0 4px 14px rgba(79, 70, 229, .08);
  }
  .circle-ai-card.thinking { color: #6366f1; }

  /* ---------- 搜索无结果兜底 ---------- */
  .empty-tip {
    text-align: center;
    color: #94a3b8;
    font-size: .9rem;
    background: #fff;
    border: 1px dashed #e2e8f0;
    border-radius: 14px;
    padding: 34px 20px;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 18px 60px; }

  .page-title { text-align: center; font-size: 1.6rem; font-weight: 800; color: #1e293b; }
  .page-sub { text-align: center; font-size: .85rem; color: #94a3b8; margin: 6px 0 26px; letter-spacing: 1px; }

  /* ---------- 我的圈子折叠面板 ---------- */
  .my-circles {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(30, 41, 59, .06);
    margin-bottom: 22px;
    overflow: hidden;
  }
  .my-circles-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 20px;
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    font-size: 1rem;
    color: #334155;
    transition: background .15s;
  }
  .my-circles-head:hover { background: #f8fafc; }
  .arrow { font-size: .8rem; color: #94a3b8; transition: transform .25s ease; }
  .my-circles.open .arrow { transform: rotate(180deg); }

  .my-circles-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .my-circles.open .my-circles-body { max-height: 400px; }
  .mc-group { padding: 2px 20px 12px; }
  .mc-group:first-child { padding-top: 6px; }
  .mc-group-label {
    font-size: .74rem;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: .5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
  }
  /* 外圈/内圈 ❓ 引导图标（统一圆圈风格） */
  .mc-help {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #cbd5e1;
    color: #fff;
    font-size: .62rem;
    font-weight: 800;
    cursor: pointer;
    margin-left: 5px;
    user-select: none;
    transition: background .2s ease, transform .2s ease;
    flex: none;
  }
  .mc-help:hover { background: #3b82f6; transform: scale(1.15); }

  /* 外圈/内圈说明弹窗（复用 quiz 弹窗视觉风格） */
  .mc-tip-mask {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 990;
    background: rgba(15, 23, 42, .42);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .mc-tip-mask.open { display: flex; animation: quizMaskIn .18s ease both; }
  .mc-tip-card {
    position: relative;
    width: 420px;
    max-width: 92vw;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, .28);
    padding: 24px 26px 22px;
    animation: quizCardIn .22s ease both;
  }
  .mc-tip-title { font-size: 1.02rem; font-weight: 800; color: #1e293b; margin-bottom: 12px; padding-right: 30px; }
  .mc-tip-body { font-size: .88rem; color: #475569; line-height: 1.85; }
  .mc-tip-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .mc-tip-ok {
    border: none;
    font-family: inherit;
    font-size: .86rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #3b82f6, #4f46e5);
    border-radius: 10px;
    padding: 9px 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59, 130, 246, .28);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .mc-tip-ok:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, .38); }
  .my-circles-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .my-circle-chip {
    font-size: .85rem;
    font-weight: 600;
    border-radius: 10px;
    padding: 8px 14px;
  }
  /* 外圈：浅蓝标签 */
  .my-circle-chip.outer {
    background: #e0f2fe;
    border: 1px solid #bae6fd;
    color: #0369a1;
    box-shadow: 0 2px 6px rgba(2, 132, 199, .1);
  }
  /* 内圈：浅绿标签 */
  .my-circle-chip.inner {
    background: #dcfce7;
    border: 1px solid #bbf7d0;
    color: #15803d;
    box-shadow: 0 2px 6px rgba(22, 163, 74, .1);
  }

  /* ---------- 互斥 Tab ---------- */
  .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
  .tab-btn {
    flex: 1;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #64748b;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(30, 41, 59, .05);
    padding: 12px 0;
    font-size: .95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all .18s ease;
  }
  .tab-btn:hover { border-color: #c7d2fe; color: #4f46e5; }
  .tab-btn.active {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border-color: #4f46e5;
    color: #fff;
    box-shadow: 0 6px 16px rgba(79, 70, 229, .3);
  }

  /* ---------- 广场卡片 ---------- */
  .plaza-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(30, 41, 59, .06);
    padding: 16px 20px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: box-shadow .18s, transform .18s;
  }
  .plaza-card:hover { box-shadow: 0 8px 22px rgba(30, 41, 59, .1); transform: translateY(-1px); }
  .plaza-meta { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: #94a3b8; margin-bottom: 6px; flex-wrap: wrap; }
  .plaza-author { font-weight: 600; color: #475569; }
  .plaza-time { font-size: .75rem; color: #94a3b8; margin-left: auto; }

  /* ---------- “换一批”小胶囊按钮（浅色背景，不抢眼但清晰） ---------- */
  .interest-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .refresh-btn {
    flex: none;
    align-self: center;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #64748b;
    border-radius: 50px;
    padding: 7px 14px;
    font-size: .8rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all .18s ease;
  }
  .refresh-btn:hover { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }
  .refresh-btn:active { transform: scale(.96); }

  /* ---------- 轻提示 toast ---------- */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: rgba(30, 41, 59, .92);
    color: #fff;
    font-size: .85rem;
    border-radius: 50px;
    padding: 9px 20px;
    box-shadow: 0 6px 20px rgba(30, 41, 59, .25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .club-tag {
    font-size: .68rem;
    font-weight: 700;
    color: #6d28d9;
    background: linear-gradient(135deg, #ede9fe, #e0e7ff);
    border: 1px solid #c4b5fd;
    border-radius: 6px;
    padding: 1px 7px;
  }
  .plaza-title { font-size: 1.05rem; font-weight: 700; color: #1e293b; }
  .plaza-toggle { font-size: .78rem; color: #4f46e5; margin-top: 8px; }
  .plaza-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .plaza-card.open .plaza-detail { max-height: 300px; }
  .plaza-detail p {
    font-size: .9rem;
    line-height: 1.8;
    color: #475569;
    padding-top: 10px;
    border-top: 1px dashed #e2e8f0;
    margin-top: 10px;
  }
  .plaza-card.open .plaza-toggle { color: #94a3b8; }

  /* ---------- 兴趣圈子卡片 ---------- */
  .interest-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(30, 41, 59, .06);
    padding: 16px 20px;
    margin-bottom: 14px;
    transition: box-shadow .18s, transform .18s;
  }
  .interest-card:hover { box-shadow: 0 8px 22px rgba(30, 41, 59, .1); transform: translateY(-1px); }
  .interest-icon {
    flex: none;
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    background: #eef2ff;
    border-radius: 12px;
  }
  .interest-info { flex: 1; min-width: 0; }
  .interest-name { font-size: 1rem; font-weight: 700; color: #1e293b; }
  .interest-members { font-size: .75rem; color: #f59e0b; font-weight: 600; margin-left: 6px; }
  .interest-desc { font-size: .85rem; color: #64748b; margin-top: 4px; }

  /* 兴趣卡右侧操作区：申请加入外圈 / 内圈 */
  .interest-actions {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-left: 14px;
  }
  .join-btn {
    border-radius: 9px;
    padding: 7px 12px;
    font-size: .78rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .15s, filter .15s, background .15s, border-color .15s;
  }
  .join-btn:active { transform: scale(.96); }
  /* 外圈：浅色描边风格 */
  .join-btn.join-outer {
    background: #fff;
    border: 1px solid #bae6fd;
    color: #0369a1;
  }
  .join-btn.join-outer:hover { background: #f0f9ff; border-color: #7dd3fc; }
  /* 内圈：深色实心醒目风格 */
  .join-btn.join-inner {
    background: linear-gradient(135deg, #16a34a, #15803d);
    border: 1px solid #15803d;
    color: #fff;
    box-shadow: 0 3px 8px rgba(22, 163, 74, .28);
  }
  .join-btn.join-inner:hover { filter: brightness(1.07); }
  /* 窄屏：按钮横排缩小，避免挤变形 */
  @media (max-width: 620px) {
    .interest-card { flex-wrap: wrap; }
    .interest-actions { flex-direction: row; margin-left: 62px; margin-top: 4px; width: 100%; }
    .join-btn { flex: 1; padding: 8px 6px; font-size: .72rem; text-align: center; }
  }

  .panel[hidden] { display: none; }

  /* ---------- “我的圈子”标签可点击进入聊天室 ---------- */
  .my-circle-chip { position: relative; cursor: pointer; transition: transform .15s, box-shadow .15s; user-select: none; }
  .my-circle-chip:hover { transform: translateY(-1px); }
  .my-circle-chip.outer:hover { box-shadow: 0 4px 12px rgba(2, 132, 199, .22); }
  .my-circle-chip.inner:hover { box-shadow: 0 4px 12px rgba(22, 163, 74, .22); }

  /* 全局演示红点（绑定 demoRedDots.hasUnreadCircles） */
  .g-red-dot {
    position: absolute;
    top: -5px;
    left: -5px;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    box-shadow: 0 0 5px red;
    z-index: 2;
  }

  /* ---------- 右侧滑出式社团聊天室（抽屉） ---------- */
  .chat-drawer {
    position: fixed;
    right: 0; top: 0;
    height: 100%;
    width: 380px;
    max-width: 100vw;
    background: #f8fafc;
    box-shadow: -8px 0 30px rgba(30, 41, 59, .16);
    transform: translateX(100%);
    transition: transform .3s ease;
    z-index: 950;
    display: flex;
    flex-direction: column;
  }
  .chat-drawer.open { transform: translateX(0); }
  .chat-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
  }
  .chat-title { font-size: .98rem; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .chat-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-close {
    flex: none;
    border: none;
    background: rgba(255, 255, 255, .18);
    color: #fff;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: .85rem;
    cursor: pointer;
    transition: background .15s;
  }
  .chat-close:hover { background: rgba(255, 255, 255, .32); }

  /* 消息列表：唯一滚动区（flex:1 + min-height:0 保证输入栏始终可见） */
  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.mine { flex-direction: row-reverse; }
  .msg-avatar {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    background: #e0e7ff;
  }
  .msg.mine .msg-avatar { background: #dcfce7; }
  .msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 3px; }
  .msg.mine .msg-body { align-items: flex-end; }
  .msg-name { font-size: .72rem; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
  .msg-name .vip { font-size: .68rem; }
  .msg-bubble {
    font-size: .86rem;
    line-height: 1.6;
    color: #334155;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 4px 12px 12px 12px;
    padding: 8px 12px;
    box-shadow: 0 1px 3px rgba(30, 41, 59, .05);
    word-break: break-word;
  }
  .msg.mine .msg-bubble {
    color: #fff;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border-color: transparent;
    border-radius: 12px 4px 12px 12px;
  }

  /* 底部输入栏：固定不参与滚动 */
  .chat-input-bar {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    background: #fff;
    border-top: 1px solid #e2e8f0;
  }
  .chat-input-bar input {
    flex: 1;
    min-width: 0;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    padding: 9px 12px;
    font-size: .86rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .chat-input-bar input:focus { border-color: #a5b4fc; box-shadow: 0 0 0 3px rgba(99, 102, 241, .14); }
  .chat-send {
    flex: none;
    border: none;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
    border-radius: 9px;
    padding: 0 18px;
    font-size: .86rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .chat-send:hover { filter: brightness(1.06); }
  .chat-send:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  /* ============================================================
     左下角悬浮：AI 性格测试与社团推荐
     ============================================================ */
  .quiz-fab {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 900;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 50px;
    padding: 7px 16px 7px 8px;
    box-shadow: 0 8px 22px rgba(124, 58, 237, .22);
    cursor: pointer;
    user-select: none;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .quiz-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(124, 58, 237, .32); }
  .quiz-ico {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    box-shadow: 0 4px 10px rgba(79, 70, 229, .35);
  }
  /* 气泡提示：轻微上下漂浮，吸引点击 */
  .quiz-bubble {
    position: relative;
    font-size: .8rem;
    font-weight: 600;
    color: #6d28d9;
    background: #f5f3ff;
    border: 1px solid #ddd6fe;
    border-radius: 14px;
    padding: 6px 12px;
    white-space: nowrap;
    animation: quizFloat 2.4s ease-in-out infinite;
  }
  /* 气泡左侧小尖角 */
  .quiz-bubble::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 6px 6px 6px 0;
    border-style: solid;
    border-color: transparent #f5f3ff transparent transparent;
  }
  @keyframes quizFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

<script>
  // ---------- 预设数据：广场（真实社团日常计划；发布时间为动态计算，随刷新变化） ----------
  const NOW = Date.now();
  const HOUR = 3600000, DAY = 86400000;
  const plazaPosts = [
    {
      author: '街舞社社长',
      club: '🏅 街舞社',
      title: '2026年秋季街舞社招新啦！',
      time: NOW - 2 * HOUR,                         // 当前时间 - 2 小时
      detail: '日常计划：每周三、五晚19:00-21:00在风雨操场进行常规训练；每月一次校园快闪活动；本学期末将举办大型街舞专场演出。零基础也收，快来加入我们！'
    },
    {
      author: '计协管理员',
      club: '🏅 计算机协会',
      title: '计算机协会技术分享会及项目组队',
      time: NOW - 5 * HOUR,                         // 当前时间 - 5 小时
      detail: '日常计划：每周六下午14:00在图书馆研讨室举行技术分享会；每月进行一次项目组队，主攻前端开发与AI应用；计划本学期举办一次AI应用开发大赛。欢迎扫码进群！'
    },
    {
      author: '青协外联部',
      club: '🏅 志愿者协会',
      title: '志愿者协会秋季招募及活动安排',
      time: NOW - 1 * DAY,                          // 当前时间 - 1 天
      detail: '日常计划：每月第一个周末前往沙坪坝区敬老院开展志愿服务；每周三下午参与校园清扫活动；节假日不定期组织大型志愿活动，有志愿时长。包车接送，快来报名！'
    }
  ];

  // ---------- 相对时间格式化（刚刚 / N分钟前 / N小时前 / N天前，超7天显示具体日期） ----------
  function formatTime(ts) {
    const diff = Date.now() - ts;
    const pad = n => String(n).padStart(2, '0');
    if (diff < 60000) return '刚刚';
    if (diff < HOUR) return Math.floor(diff / 60000) + '分钟前';
    if (diff < DAY) return Math.floor(diff / HOUR) + '小时前';
    if (diff < 7 * DAY) return Math.floor(diff / DAY) + '天前';
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // ---------- 预设数据：你可能感兴趣的圈子（两组数据池，换一批循环切换） ----------
  const interestGroups = [
    [
      { icon: '🚀', name: '科幻社', members: 430, desc: '探讨科幻文学与电影，一起仰望星空。' },
      { icon: '📷', name: '摄影协会', members: 620, desc: '用镜头记录校园之美，不定期组织外拍活动。' },
      { icon: '🏓', name: '乒乓球社', members: 350, desc: '切磋球技，以球会友，每周三晚体育馆见。' }
    ],
    [
      { icon: '🏀', name: '篮球社', members: 880, desc: '无兄弟，不篮球！每周四晚体育馆约球。' },
      { icon: '🎌', name: '动漫社', members: 510, desc: '二次元同好聚集地，不定期举办漫展和观影会。' },
      { icon: '🎤', name: '辩论队', members: 280, desc: '唇枪舌战，思维碰撞，欢迎热爱思考的你。' }
    ]
  ];
  let interestIdx = 0;   // 当前展示第几组

  const esc = s => String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  // ---------- 渲染广场（传入帖子数组；按发布时间降序，空数组显示兜底文案） ----------
  const panelPlaza = document.getElementById('panelPlaza');
  const plazaList = document.getElementById('plazaList');
  function plazaCardHTML(p) {
    return `
    <div class="plaza-card">
      <div class="plaza-meta">
        <span class="plaza-author">${esc(p.author)}</span>
        <span class="club-tag">${esc(p.club)}</span>
        <span class="plaza-time" title="${new Date(p.time).toLocaleString('zh-CN')}">🕒 ${formatTime(p.time)}</span>
      </div>
      <div class="plaza-title">${esc(p.title)}</div>
      <div class="plaza-toggle">点击查看详细内容 ▼</div>
      <div class="plaza-detail"><p>${esc(p.detail)}</p></div>
    </div>`;
  }
  function renderPlaza(list) {
    const sorted = [...list].sort((a, b) => b.time - a.time);
    plazaList.innerHTML = sorted.length
      ? sorted.map(plazaCardHTML).join('')
      : '<div class="empty-tip">🔍 未找到相关结果，换个词试试吧~</div>';
  }
  renderPlaza(plazaPosts);

  // ---------- 渲染兴趣圈子（传数组则渲染该数组，不传则渲染当前组；空数组显示兜底） ----------
  const panelInterest = document.getElementById('panelInterest');
  const interestList = document.getElementById('interestList');
  function interestCardHTML(c) {
    return `
    <div class="interest-card">
      <div class="interest-icon">${esc(c.icon)}</div>
      <div class="interest-info">
        <div>
          <span class="interest-name">${esc(c.name)}</span>
          <span class="interest-members">${c.members} 人</span>
        </div>
        <div class="interest-desc">${esc(c.desc)}</div>
      </div>
      <div class="interest-actions">
        <button type="button" class="join-btn join-outer" data-join="outer" data-name="${esc(c.name)}">📩 申请加入外圈</button>
        <button type="button" class="join-btn join-inner" data-join="inner" data-name="${esc(c.name)}">✅ 申请加入内圈</button>
      </div>
    </div>`;
  }
  function renderInterest(list) {
    const data = list || interestGroups[interestIdx];
    interestList.innerHTML = data.length
      ? data.map(interestCardHTML).join('')
      : '<div class="empty-tip">🔍 未找到相关结果，换个词试试吧~</div>';
  }
  renderInterest();

  // ---------- 我的圈子折叠面板（平滑展开/收起） ----------
  const myCircles = document.getElementById('myCircles');
  document.getElementById('myCirclesHead').addEventListener('click', () => {
    myCircles.classList.toggle('open');
  });
  // 从个人中心「我的圈子」跳入时（?expand=1），默认展开显示内外圈
  if (new URLSearchParams(location.search).get('expand') === '1') {
    myCircles.classList.add('open');
  }

  // ---------- 外圈/内圈 ❓ 说明弹窗（不刷新页面；点遮罩/按钮/Esc 关闭） ----------
  const mcTipMask = document.getElementById('mcTipMask');
  const mcTipTitle = document.getElementById('mcTipTitle');
  const mcTipBody = document.getElementById('mcTipBody');
  const MC_TIPS = {
    outer: {
      title: '💡 什么是外圈？',
      body: '外圈是社团的公开区域。加入外圈后，你可以浏览社团的公开动态，查看招新信息。点击下方的“街舞社”，即可打开对应的外圈聊天室。'
    },
    inner: {
      title: '💡 什么是内圈？',
      body: '内圈是社团的核心成员区域。加入内圈需要通过认证，可以参与社团内部的决策投票和活动组织。点击下方的“计算机协会”，即可打开对应的内圈聊天室。'
    }
  };
  function openMcTip(key) {
    const tip = MC_TIPS[key];
    mcTipTitle.textContent = tip.title;
    mcTipBody.textContent = tip.body;
    mcTipMask.classList.add('open');
  }
  function closeMcTip() { mcTipMask.classList.remove('open'); }
  document.getElementById('helpOuter').addEventListener('click', e => { e.stopPropagation(); openMcTip('outer'); });
  document.getElementById('helpInner').addEventListener('click', e => { e.stopPropagation(); openMcTip('inner'); });
  document.getElementById('mcTipClose').addEventListener('click', closeMcTip);
  document.getElementById('mcTipOk').addEventListener('click', closeMcTip);
  mcTipMask.addEventListener('click', e => { if (e.target === mcTipMask) closeMcTip(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMcTip(); });

  // ---------- 互斥 Tab：同一时刻只能一个高亮，只切换内容区，不刷新页面 ----------
  const tabPlaza = document.getElementById('tabPlaza');
  const tabInterest = document.getElementById('tabInterest');
  function switchTab(target) {
    tabPlaza.classList.toggle('active', target === 'plaza');
    tabInterest.classList.toggle('active', target === 'interest');
    panelPlaza.hidden = target !== 'plaza';
    panelInterest.hidden = target !== 'interest';
    // 手动点 Tab：清除搜索态与 AI 卡片，恢复该面板的完整数据
    circleAiCard.hidden = true;
    circleAiCard.classList.remove('thinking');
    circleAiCard.textContent = '';
    if (target === 'plaza') renderPlaza(plazaPosts);
    if (target === 'interest') renderInterest();
  }
  tabPlaza.addEventListener('click', () => switchTab('plaza'));
  tabInterest.addEventListener('click', () => switchTab('interest'));

  // ---------- 搜索（接入 ai-core.js 统一 askAI；circle 板块，只传广场动态+圈子数据） ----------
  const searchBtn = document.getElementById('searchBtn');
  const searchPop = document.getElementById('searchPop');
  const searchScope = document.getElementById('searchScope');
  const searchInput = document.getElementById('searchInput');
  const circleAiCard = document.getElementById('circleAiCard');

  searchBtn.addEventListener('click', e => {
    e.stopPropagation();
    searchPop.classList.toggle('open');
    if (searchPop.classList.contains('open')) searchInput.focus();
  });

  async function doSearch() {
    const kw = searchInput.value.trim().toLowerCase();
    const scope = searchScope.value;

    // 空关键词：恢复全部、隐藏 AI 卡片
    if (!kw) {
      circleAiCard.hidden = true;
      circleAiCard.classList.remove('thinking');
      circleAiCard.textContent = '';
      if (scope === 'plaza') { switchTab('plaza'); }
      else { switchTab('interest'); }
      searchPop.classList.remove('open');
      return;
    }

    let hitPlaza = [];
    let hitCircles = [];
    if (scope === 'plaza') {
      // 匹配标题、内容、发布者、社团名
      hitPlaza = plazaPosts.filter(p => [p.title, p.detail, p.author, p.club]
        .some(t => t.toLowerCase().includes(kw)));
      switchTab('plaza');
      renderPlaza(hitPlaza);
    } else {
      // 匹配圈子名称或简介（跨两组数据池）
      hitCircles = interestGroups.flat().filter(c => [c.name, c.desc]
        .some(t => t.toLowerCase().includes(kw)));
      switchTab('interest');
      renderInterest(hitCircles);
    }
    searchPop.classList.remove('open');

    // 先展示“AI 正在分析”，再流式调用统一 AI 入口（失败/超时 ai-core 自动走本地权重模板）
    circleAiCard.hidden = false;
    circleAiCard.classList.add('thinking');
    circleAiCard.textContent = '🤖 AI正在分析广场动态与圈子信息...';
    let circleAcc = '';
    let circleStarted = false;
    const circleTyper = createTextTyper(piece => {
      if (!circleStarted) {
        circleStarted = true;
        circleAiCard.classList.remove('thinking');
        circleAiCard.textContent = '🤖 ';
      }
      circleAcc += piece;
      circleAiCard.textContent = '🤖 ' + circleAcc;
    }, 26, 2);
    const summary = await askAIStream(searchInput.value.trim(), { plaza: hitPlaza, circles: hitCircles }, 'circle', delta => circleTyper.feed(delta));
    await circleTyper.finish();
    circleAiCard.classList.remove('thinking');
    circleAiCard.textContent = '🤖 ' + summary;

  // ==========================================================================

  const quizFab = document.getElementById('quizFab');

  const QUIZ_TOTAL = 5;             // 固定 5 道单选题
  const QUIZ_INTRO_TEXT = '你好呀！我是AI性格分析师。我将问你5道单选题，根据你的选择，为你推荐最合适的社团类型。准备好开始了吗？';

  const QUIZ_STEP_SYSTEM = '你是一个资深的大学生性格分析师，正在通过5道循序渐进的单选题，为一位大学生做性格画像与社团类型匹配。硬性要求：严禁使用固定的预设题目，严禁复用陈旧题库；每道题都必须结合当前季节、当下校园热点（开学季、社团招新、期中考试、运动会、节日活动等）与随机性格维度动态生成；后续题目必须与前面已问过的题目不同，并顺着对话情境自然推进。';
  const QUIZ_ANALYZE_PROMPT = '你是一个资深的大学生性格分析师。请根据用户对这5道单选题的回答，推断其性格特征，并推荐适合的校园社团类型（如：体育竞技类、学术科技类等）。绝对不要推荐具体的某个社团名称，50字以内，语气要鼓励、专业、亲切。';

  // 预设兜底题（按单步索引取用，与动态题一样一题一问；仅在用户网络失败后主动选择示例题时使用）
  const FALLBACK_QUESTIONS = [
    { question: '周末没有安排时，你更倾向于？', options: ['参加一场热闹的社团活动', '约好友运动或聚会', '独自看书、钻研兴趣', '去做志愿者帮助他人'] },
    { question: '团队合作中，你通常扮演什么角色？', options: ['主动牵头的组织者', '出谋划策的智囊', '认真执行的可靠成员', '协调气氛的粘合剂'] },
    { question: '面对突发压力时，你通常会？', options: ['越挫越勇，立刻行动', '先冷静分析再应对', '找朋友倾诉共同承担', '按计划一步步处理'] },

  let quizStep = 0;                 // 当前题目下标 0..4

  // 解析 AI 返回的“单道题” JSON：{ "question": "题干", "options": [4项] }
  function parseSingleQuestion(raw) {
    if (!raw || typeof raw !== 'string') return null;
    let text = raw.trim();
    // 兼容模型偶尔包裹的 ```json ... ``` 代码块
    const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) text = fence[1].trim();
    // 截取第一个 { 到最后一个 }，容忍前后零散文字
    const s = text.indexOf('{'), e = text.lastIndexOf('}');
    if (s === -1 || e === -1 || e <= s) return null;
    let obj;
    try { obj = JSON.parse(text.slice(s, e + 1)); } catch (err) { return null; }
    if (!obj || typeof obj !== 'object') return null;
    const question = String(obj.question || '').trim();
    if (!question) return null;
    const options = Array.isArray(obj.options)
      ? obj.options.slice(0, 4).map(o => String(o == null ? '' : o).trim()).filter(Boolean)
      : [];
    if (options.length !== 4) return null;      // 单步题严格要求 4 个选项
    return { question, options };
  }

  // ---------- 开始：进入第 1 题 ----------
  function startQuiz() {
    quizStep = 0;
    quizHistory = [];
    quizOffline = false;
    requestQuestion(0);
  }

  // 构造第 step 题的请求消息：带上题号与之前所有问答，保证连贯且不重复
  function buildStepMessages(step) {
    let user = `这是第 ${step + 1} 道题（共 ${QUIZ_TOTAL} 题）。\n`;
    if (quizHistory.length) {
      user += '前面已经问过的题目和该同学的选择如下：\n'
        + quizHistory.map((h, i) => `Q${i + 1}. ${h.question}（该同学选择：${h.options[h.answer]}）`).join('\n')
        + '\n请确保新题目与以上题目完全不同，且顺着对话情境自然推进。\n';
    }
    user += `请生成第 ${step + 1} 道关于大学生性格的单选题，包含4个选项。请返回JSON格式：{ "question": "题干", "options": ["A","B","C","D"] }。只返回JSON，不要任何解释。`;
    return [
      { role: 'system', content: QUIZ_STEP_SYSTEM },
      { role: 'user', content: user }
    ];
  }

  // ---------- 单步请求第 step 题（流式收集 JSON，失败提示“网络波动，请重试”，绝不自动降级） ----------
  async function requestQuestion(step) {
    const token = quizToken;
    quizStep = step;
    quizSelected = null;
    renderLoading(`🤖 AI正在动态准备第 ${step + 1} / ${QUIZ_TOTAL} 题...`);

    // 用户已选择离线示例题：后续题目同样按单步给出，保持流程一致
    if (quizOffline) {
      setTimeout(() => { if (token === quizToken) renderStep(step, FALLBACK_QUESTIONS[step]); }, 260);
      return;
    }

    let question = null;
    try {
      // 流式请求：原始 JSON 在后台静默收集，不把半截 JSON 显示给用户
      const raw = await callAIAPIStream(buildStepMessages(step), () => {});
      if (token !== quizToken) return;
      question = parseSingleQuestion(raw);
    } catch (err) {
      if (token !== quizToken) return;
      console.warn('[circles] 单步出题请求失败：', err);
      renderStepError(step);
      return;
    }
    if (!question) {
      console.warn('[circles] 单步题目 JSON 无法解析');
      renderStepError(step);
      return;
    }
    renderStep(step, question);
  }

  // 网络波动错误态：可重试当前题，或主动选择离线示例题（示例题同样单步呈现）
  function renderStepError(step) {
    quizBody.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'quiz-error-box';
    box.textContent = '网络波动，请重试';

    const actions = document.createElement('div');
    actions.className = 'quiz-actions quiz-actions-between';
    const offline = document.createElement('button');
    offline.type = 'button';
    offline.className = 'quiz-btn quiz-btn-ghost quiz-btn-sm';
    offline.textContent = '📶 无网络？使用示例题';
    offline.addEventListener('click', () => {
      quizOffline = true;
      requestQuestion(step);
    });
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'quiz-btn quiz-btn-primary';
    retry.textContent = '🔄 重试';
    retry.addEventListener('click', () => requestQuestion(step));
    actions.append(offline, retry);

    quizBody.append(box, actions);
  }

  // ---------- 渲染单题：进度条 + 题干打字机 + 选项逐条浮现 + 下一题 ----------
  async function renderStep(step, q) {
    const token = quizToken;
    quizStep = step;
    quizSelected = null;
    quizBody.innerHTML = '';

    // 进度区：第 X/5 题 + 进度条
    const head = document.createElement('div');
    head.className = 'quiz-step-head';
    const count = document.createElement('span');
    count.className = 'quiz-step-count';
    count.textContent = `第 ${step + 1} / ${QUIZ_TOTAL} 题`;
    const bar = document.createElement('div');
    bar.className = 'quiz-progress-bar';
    const barInner = document.createElement('i');
    barInner.style.width = `${(step / QUIZ_TOTAL) * 100}%`;
    bar.appendChild(barInner);
    head.append(count, bar);
    quizBody.appendChild(head);

    const card = document.createElement('div');
    card.className = 'quiz-q';
    const title = document.createElement('div');
    title.className = 'quiz-q-title';
    const no = document.createElement('span');
    no.className = 'q-no';
    no.textContent = `Q${step + 1}.`;
    const titleText = document.createElement('span');
    titleText.className = 'q-title-text';
    title.append(no, titleText);
    card.appendChild(title);
    quizBody.appendChild(card);    // 先挂载，打字过程可见

    // 题干打字机：逐字追加
    await new Promise(res => {
      const typer = createTextTyper(piece => { titleText.textContent += piece; }, 20, 2);
      typer.feed(q.question);
      typer.finish().then(res);
    });
    if (token !== quizToken) return;

    // 选项逐条浮现
    const optWrap = document.createElement('div');
    card.appendChild(optWrap);
    for (let oi = 0; oi < q.options.length; oi++) {
      if (token !== quizToken) return;
      const label = document.createElement('label');
      label.className = 'quiz-opt quiz-opt-enter';
      label.innerHTML = `<input type="radio" name="quiz-step${step}"><span></span>`;
      label.querySelector('span').textContent = q.options[oi];
      label.addEventListener('click', () => {
        quizSelected = oi;
        card.querySelectorAll('.quiz-opt').forEach(el => el.classList.remove('sel'));
        label.classList.add('sel');
        const btn = document.getElementById('quizNext');
        if (btn) btn.disabled = false;
      });
      optWrap.appendChild(label);
      await new Promise(r => setTimeout(r, 80));
    }
    if (token !== quizToken) return;

    // 底部操作：未选择前禁用；最后一题显示“提交分析”
    const actions = document.createElement('div');
    actions.className = 'quiz-actions';
    const next = document.createElement('button');
    next.type = 'button';
    next.className = 'quiz-btn quiz-btn-primary';
    next.id = 'quizNext';
    next.disabled = true;
    next.textContent = step < QUIZ_TOTAL - 1 ? '下一题 →' : '✅ 提交分析';
    next.addEventListener('click', () => {
      if (quizSelected === null) return;
      // 记录本题答案后推进
      quizHistory[step] = { question: q.question, options: q.options.slice(), answer: quizSelected };
      if (step < QUIZ_TOTAL - 1) requestQuestion(step + 1);
      else submitAnalysis();
    });
    actions.appendChild(next);
    quizBody.appendChild(actions);
  }

  // ---------- 阶段三：5题答完，打包答案流式请求 AI 分析（失败 → 预设兜底文案，逐字输出） ----------
  async function submitAnalysis() {
    if (quizHistory.length !== QUIZ_TOTAL) {
      window.alert('请完成所有题目');
      return;
    }
    const token = quizToken;
    const letters = 'ABCD';
    // 打包答案：Q1: A, Q2: C ... 并附上题干与所选内容，便于模型分析
    const answerBrief = quizHistory.map((h, i) => `Q${i + 1}: ${letters[h.answer]}`).join(', ');
    const detail = quizHistory.map((h, i) =>
      `${i + 1}. ${h.question}\n我的选择：${letters[h.answer]}. ${h.options[h.answer]}`
    ).join('\n');

    renderLoading('🤖 AI正在分析你的性格画像...');

    // 结果卡片：首个增量到达时由 loading 切换为结果区，文字逐字出现
    let box = null;
    let textEl = null;
    function ensureResult(isFallback) {
      if (box) return;
      quizBody.innerHTML = '';
      box = document.createElement('div');
      box.className = 'quiz-result';
      if (isFallback) {
        const tag = document.createElement('span');
        tag.className = 'quiz-fallback-tag';
        tag.textContent = '当前为离线推荐';
        box.appendChild(tag);
        box.appendChild(document.createElement('br'));
      }
      textEl = document.createElement('div');
      textEl.className = 'quiz-result-text';
      box.appendChild(textEl);
      quizBody.appendChild(box);
    }

    let acc = '';
    let isFallback = false;
    const typer = createTextTyper(piece => {
      if (token !== quizToken) return;   // 弹窗已关闭/重开，丢弃过期输出
      ensureResult(isFallback);
      acc += piece;
      textEl.textContent = acc;
    }, 26, 2);

    try {
      const full = await callAIAPIStream(
        [
          { role: 'system', content: QUIZ_ANALYZE_PROMPT },
          { role: 'user', content: `我的答题记录（格式：Q1: A, Q2: C ...）：${answerBrief}\n\n题目与所选选项：\n${detail}` }
        ],
        delta => typer.feed(delta)
      );
      if (token !== quizToken) return;
      void full;
    } catch (err) {
      // 分析阶段任何失败：使用预设兜底文案（仍逐字输出）
      if (token !== quizToken) return;
      console.warn('[circles] AI分析失败，启用预设推荐文案：', err);
      isFallback = true;
      typer.feed(QUIZ_ANALYZE_FALLBACK);
    }
    await typer.finish();
    if (token !== quizToken) return;

    // 流式成功但内容为空：同样使用预设兜底文案
    if (!acc.trim()) {
      ensureResult(false);
      isFallback = true;
      acc = '';
      textEl.textContent = '';
      const fbTyper = createTextTyper(piece => {
        if (token !== quizToken) return;
        acc += piece;
        textEl.textContent = acc;
      }, 26, 2);
      fbTyper.feed(QUIZ_ANALYZE_FALLBACK);
      await fbTyper.finish();
      if (token !== quizToken) return;
      // 补离线标签
      const tag = document.createElement('span');
      tag.className = 'quiz-fallback-tag';
      tag.textContent = '当前为离线推荐';
      box.insertBefore(tag, box.firstChild);
      box.insertBefore(document.createElement('br'), textEl);
    }

    // 输出完成：补“重新测试”操作区（打字期间不显示，避免布局抖动）；重测回到前置弹窗
    const actions = document.createElement('div');
    actions.className = 'quiz-actions';
    const restart = document.createElement('button');
    restart.type = 'button';
    restart.className = 'quiz-btn quiz-btn-ghost';
    restart.textContent = '🔄 重新测试';
    restart.addEventListener('click', renderIntro);
    actions.appendChild(restart);
    quizBody.appendChild(actions);
  }
</script>
